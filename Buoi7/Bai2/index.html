
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh mục sản phẩm</title>
    <link rel="stylesheet" href="style.css">
</head>

        <h2>DANH MỤC SẢN PHẨM</h2>

        <div class="product-list">
            <the-san-pham
                v-for="product in products"
                :key="product.id"
                :ten="product.ten"
                :gia="product.gia"
                :anh="product.anh"
                :mo-ta="product.moTa"
                :so-luong-ton="product.soLuongTon"
            ></the-san-pham>
        </div>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="components/TheSanPham.js"></script>

    <script>
        const app = Vue.createApp({

                return {

                        {

                            gia: 38690000,

                                Camera: Bộ 3 camera sau 48MP, zoom quang học 4x, quay video 4K Dolby Vision 120 fps; camera trước 18MP.

                                    Màn hình Dynamic AMOLED 2X 11 inch 120Hz hiển thị sắc nét sống động hỗ trợ Vision Booster chống chói hiệu quả

        app.mount("#app");

</html>
